  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Hero Banner */
    .hero {
      position: relative;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 58, 138, 0.9)), url('02-尖山埤露營區介紹/2026-10-27-08時-尖山埤露營區介紹_001.jpg');
      background-size: cover;
      background-position: center;
      padding: 60px 20px 40px;
      text-align: center;
      border-bottom: 2px solid var(--border);
    }
    .hero-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }
    .hero p {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 800px;
      margin: 0 auto 24px;
    }
    .stats-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .stat-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      padding: 12px 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      min-width: 140px;
    }
    .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Sticky Navigation */
    .nav-container {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .nav-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex-wrap: wrap;
      gap: 12px;
    }
    .view-toggles {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: var(--card-hover);
      border-color: var(--primary-light);
    }
    .btn.active {
      background: var(--primary);
      border-color: var(--primary-light);
      color: #fff;
    }
    .search-box {
      position: relative;
      flex-grow: 1;
      max-width: 320px;
    }
    .search-input {
      width: 100%;
      padding: 8px 14px 8px 36px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary-light);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Horizontal Theme Scroller */
    .theme-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .theme-pills::-webkit-scrollbar {
      height: 6px;
    }
    .theme-pills::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .pill {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .pill.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border-color: var(--accent);
    }
    .pill-count {
      background: rgba(255,255,255,0.2);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    /* Main Container */
    .main-container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* Theme Section */
    .theme-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 40px;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .theme-section.hidden {
      display: none !important;
    }
    .theme-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.4);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .theme-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .theme-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .theme-number {
      background: var(--primary);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .theme-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }
    .theme-time {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--accent);
      background: rgba(245, 158, 11, 0.1);
      padding: 4px 12px;
      border-radius: 6px;
      font-weight: 600;
    }
    .theme-desc {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }
    .theme-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .theme-tag {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    /* Photo Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 24px;
    }
    .photo-card {
      position: relative;
      background: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16/9;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    }
    .photo-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      border-color: var(--accent);
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.3s;
    }
    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      align-items: flex-end;
      padding: 10px;
    }
    .photo-card:hover .photo-overlay {
      opacity: 1;
    }
    .photo-name {
      color: #fff;
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox-top {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    .lightbox-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .lightbox-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .lightbox-close:hover {
      background: rgba(255,255,255,0.2);
    }
    .lightbox-content {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: calc(100vh - 140px);
    }
    .lightbox-img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      user-select: none;
    }
    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      color: #fff;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lightbox-arrow:hover {
      background: var(--accent);
      color: #000;
    }
    .lightbox-prev {
      left: 10px;
    }
    .lightbox-next {
      right: 10px;
    }
    .lightbox-bottom {
      width: 100%;
      max-width: 1200px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Back to top button */
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--primary);
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 99;
    }
    .back-to-top.show {
      opacity: 1;
      visibility: visible;
    }
    .back-to-top:hover {
      background: var(--accent);
      color: #000;
      transform: translateY(-4px);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.9rem;
      background: rgba(15, 23, 42, 0.8);
    }

    @media (max-width: 768px) {
      .hero { padding: 40px 16px 30px; }
      .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
        padding: 14px;
      }
      .theme-header { padding: 16px; }
      .lightbox-arrow {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>

    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('btn-tab-view').classList.toggle('active', mode === 'tab');
      document.getElementById('btn-timeline-view').classList.toggle('active', mode === 'timeline');

      themes.forEach((_, idx) => {
        const sec = document.getElementById(`section-${idx}`);
        if (sec) {
          if (mode === 'timeline') {
            sec.classList.remove('hidden');
          } else {
            sec.classList.toggle('hidden', idx !== currentThemeIndex);
          }
        }
      });

      if (mode === 'tab') {
        selectTheme(currentThemeIndex);
      }
    }

    // Select Theme Pill
    function selectTheme(index) {
      currentThemeIndex = index;
      document.querySelectorAll('.pill').forEach((p, idx) => {
        p.classList.toggle('active', idx === index);
      });

      if (currentViewMode === 'tab') {
        themes.forEach((_, idx) => {
          const sec = document.getElementById(`section-${idx}`);
          if (sec) sec.classList.toggle('hidden', idx !== index);
        });
        window.scrollTo({ top: document.querySelector('.hero').offsetHeight - 20, behavior: 'smooth' });
      } else {
        const targetSec = document.getElementById(`section-${index}`);
        if (targetSec) {
          const offset = targetSec.getBoundingClientRect().top + window.pageYOffset - 120;
          window.scrollTo({ top: offset, behavior: 'smooth' });
        }
      }

      // Scroll pill into view
      const activePill = document.getElementById(`pill-${index}`);
      if (activePill) {
        activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    // Search filter
    function handleSearch(keyword) {
      keyword = keyword.trim().toLowerCase();
      if (!keyword) {
        setViewMode(currentViewMode);
        return;
      }
      // Switch to timeline to show all matched
      document.getElementById('btn-tab-view').classList.remove('active');
      document.getElementById('btn-timeline-view').classList.add('active');
      currentViewMode = 'timeline';

      themes.forEach((t, idx) => {
        const sec = document.getElementById(`section-${idx}`);
        const match = t.title.toLowerCase().includes(keyword) || 
                      t.desc.toLowerCase().includes(keyword) ||
                      t.tags.some(tag => tag.toLowerCase().includes(keyword));
        if (sec) sec.classList.toggle('hidden', !match);
      });
    }

    // Lightbox Controls
    function openLightbox(themeIdx, imgIdx) {
      const theme = themes[themeIdx];
      currentLightboxList = theme.images.map(img => ({
        url: `${encodeURIComponent(theme.folder)}/${encodeURIComponent(img)}`,
        title: `${theme.title} - ${img}`,
        themeTitle: theme.title,
        name: img
      }));
      currentLightboxIndex = imgIdx;
      updateLightbox();
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function updateLightbox() {
      const item = currentLightboxList[currentLightboxIndex];
      const img = document.getElementById('lightbox-img');
      img.src = item.url;
      document.getElementById('lightbox-title').innerText = item.name;
      document.getElementById('lightbox-bottom').innerText = 
        `${item.themeTitle} (${currentLightboxIndex + 1} / ${currentLightboxList.length})`;
    }

    function changeLightboxImage(step) {
      currentLightboxIndex = (currentLightboxIndex + step + currentLightboxList.length) % currentLightboxList.length;
      updateLightbox();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      const lightbox = document.getElementById('lightbox');
      if (lightbox.classList.contains('active')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') changeLightboxImage(-1);
        if (e.key === 'ArrowRight') changeLightboxImage(1);
      }
    });

    // Back to top scroll listener
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('back-to-top');
      if (window.scrollY > 400) {
        btn.classList.add('show');
      } else {
        btn.classList.remove('show');
      }
    });

    // Start
    initPills();
    renderThemes();
  </script>
</body>
</html>
